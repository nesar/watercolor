[DEFAULT]
# All sections below are required unless otherwise specified.
# See https://github.com/fastai/nbdev/blob/master/settings.ini for examples.

### Python library ###
repo = watercolor
lib_name = %(repo)s
version = 0.0.1
min_python = 3.12
license = apache2
black_formatting = False

### nbdev ###
doc_path = _docs
lib_path = watercolor
nbs_path = nbs
recursive = True
tst_flags = notest
put_version_in_init = True

### Docs ###
branch = main
custom_sidebar = False
doc_host = https://%(user)s.github.io
doc_baseurl = /%(repo)s
git_url = https://github.com/%(user)s/%(repo)s
title = %(lib_name)s

### PyPI ###
audience = Developers
author = nesar
author_email = nramachandra@anl.gov
copyright = 2023 onwards, %(author)s
description = Painting hydrodynamical simulations with galaxy colors
keywords = nbdev jupyter notebook python
language = English
status = 3
user = nesar

### Optional ###
# opencosmo>=1.4.0b2 needs Python>=3.12 and numpy>=2; DustE's own PyPI
# metadata hard-pins arviz==0.11.2 (incompatible with numpy>=2 and with
# modern scipy/matplotlib) but only actually calls one long-stable arviz
# function (az.from_netcdf) -- install a modern arviz explicitly after
# DustE if a single `pip install -e .` can't resolve both at once. See the
# opencosmo312 conda env (/home/nramachandra/anaconda3/envs/opencosmo_env)
# for a known-working combination.
requirements = numpy>=2 matplotlib opencosmo>=1.4.0b2 astropy arviz DustE astro-sedpy
dev_requirements = pandas seaborn scipy>=1.13 GetDist
# console_scripts =